# regiochecker: bronnenplatform voor regioverslaggevers (gemeentelijke bronnen,
# kamerstukken, audio en video) met feed, meldingen en weekmail.
# Pad op VPS: /opt/regiochecker/
#
# Traefik pakt de container op via de labels. De site staat op checker.mh-n.nl
# (DNS wijst naar deze server, certificaat via de letsencrypt-resolver, net als
# de andere mh-n.nl-sites). De oude adressen regiochecker.vroeg.app en
# checker.vroeg.app verwijzen door; hun DNS-records maakt
# traefik-cloudflare-companion, die alleen bij het opstarten scant (een nieuwe
# hostnaam vraagt `docker restart traefik-companion`).

services:
  regiochecker:
    build: .
    image: regiochecker:latest
    container_name: regiochecker
    restart: unless-stopped
    ports:
      # Alleen op loopback, zodat het uitsluitend via Traefik naar buiten gaat.
      - "127.0.0.1:3056:3000"
    volumes:
      # Gebruikers, instellingen (ook SMTP-wachtwoord, Claude-sleutel en
      # worker-token), alle gevonden items, de databases (kamerstukken, gelezen/
      # bewaard, het audioarchief) en bewaarde audio. Back-up = deze map kopiëren
      # (de .sqlite-bestanden bij voorkeur met de dienst gestopt). Moet van
      # uid 1000 zijn: de container draait als gebruiker node.
      - ./data:/app/data
    env_file:
      # Optioneel, voor ANTHROPIC_API_KEY, WORKER_URL en WORKER_TOKEN; zie .env.example.
      - path: .env
        required: false
    environment:
      - REGIOCHECKER_SITE_URL=https://checker.mh-n.nl
      # Na inloggen via Authelia zet Traefik de gebruiker in Remote-User (de
      # forward-auth-middleware overschrijft wat de browser zelf meestuurt). Zonder
      # die koptekst weigert de API alles; zo kan een verzoek dat de inlog omzeilt
      # (van binnen het Docker-netwerk) niets.
      - REGIOCHECKER_AUTH_KOP=remote-user
      # Uitnodigen in Beheer › Gebruikers maakt ook het Authelia-account aan. De
      # app zet daarvoor een aanvraag in data/authelia/; het hulpscript op de
      # server (scripts/authelia-accounts.py, via systemd) schrijft in Authelia.
      - REGIOCHECKER_AUTHELIA_ACCOUNTS=1
      # Ollama en de Whisper-worker draaien op een machine in het tailnet. Deze
      # server zit daar zelf niet in; de Tailscale-container hieronder wel. Alleen
      # dat verkeer gaat door zijn proxy.
      - REGIOCHECKER_TAILNET_PROXY=http://regiochecker-tailscale:1055
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.regiochecker.rule=Host(`checker.mh-n.nl`)"
      - "traefik.http.routers.regiochecker.entrypoints=websecure"
      - "traefik.http.routers.regiochecker.tls=true"
      - "traefik.http.routers.regiochecker.tls.certresolver=letsencrypt"
      - "traefik.http.routers.regiochecker.service=regiochecker"
      - "traefik.http.services.regiochecker.loadbalancer.server.port=3000"
      # De oude adressen (vroeg.app, certificaat via de cloudflare-resolver)
      # verwijzen permanent door, met behoud van pad en #-route.
      - "traefik.http.routers.regiochecker-oud.rule=Host(`regiochecker.vroeg.app`) || Host(`checker.vroeg.app`)"
      - "traefik.http.routers.regiochecker-oud.entrypoints=websecure"
      - "traefik.http.routers.regiochecker-oud.tls=true"
      - "traefik.http.routers.regiochecker-oud.tls.certresolver=cloudflare"
      - "traefik.http.routers.regiochecker-oud.service=regiochecker"
      - "traefik.http.routers.regiochecker-oud.middlewares=regiochecker-naar-mhn"
      - "traefik.http.middlewares.regiochecker-naar-mhn.redirectregex.regex=^https://[^/]+/(.*)"
      - "traefik.http.middlewares.regiochecker-naar-mhn.redirectregex.replacement=https://checker.mh-n.nl/$${1}"
      - "traefik.http.middlewares.regiochecker-naar-mhn.redirectregex.permanent=true"
      # Inloggen via de gedeelde Authelia op authelia.mh-n.nl (/opt/authelia). De
      # middleware staat in de labels van die container; de cookie voor mh-n.nl en
      # de toegangsregel voor deze site in /opt/authelia/config/configuration.yml.
      #
      # Eerst de Authorization-kop weghalen. Authelia accepteert op forward-auth
      # ook basic auth; een browser die nog de oude basic-auth-gegevens van deze
      # site onthoudt, stuurt die mee en krijgt dan een wachtwoord-pop-up in plaats
      # van het inlogscherm. De app zelf gebruikt die kop niet.
      - "traefik.http.middlewares.regiochecker-zonder-basic.headers.customrequestheaders.Authorization="
      - "traefik.http.routers.regiochecker.middlewares=regiochecker-zonder-basic,authelia@docker"
    networks:
      - traefik
      - intern

  # Tailscale als sidecar, in userspace-modus: geen extra rechten, geen wijziging
  # aan de server zelf. Biedt alleen een HTTP-proxy naar het tailnet, op een eigen
  # netwerk waar alleen de regiochecker bij kan. Op het gedeelde traefik-netwerk
  # zou elke andere container via deze proxy het tailnet in kunnen.
  #
  # Koppelen: zet TS_AUTHKEY=tskey-auth-… in tailscale.env (zie README), of draai
  # ./tailscale-inloggen.sh voor een inloglink. De link uit `docker compose logs`
  # werkt niet: de container geeft een interactieve login maar 60 seconden en
  # herstart dan met een nieuwe link. De machinestatus staat daarna in
  # ./tailscale, dus koppelen is eenmalig.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: regiochecker-tailscale
    hostname: regiochecker
    restart: unless-stopped
    env_file:
      - path: tailscale.env
        required: false
    environment:
      - TS_HOSTNAME=regiochecker
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      # Met bewaarde status niet opnieuw inloggen bij een herstart.
      - TS_AUTH_ONCE=true
      # Staat Ollama op een lokaal netwerk dat een andere machine als subnet
      # router in het tailnet aanbiedt, dan ziet de proxy dat netwerk alleen
      # met accept-routes.
      - TS_EXTRA_ARGS=--accept-routes
      - TS_OUTBOUND_HTTP_PROXY_LISTEN=0.0.0.0:1055
    volumes:
      - ./tailscale:/var/lib/tailscale
    networks:
      - intern

networks:
  traefik:
    name: traefik
    external: true
  intern:
    name: regiochecker-intern
