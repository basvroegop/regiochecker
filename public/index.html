<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regiochecker</title>
  <link rel="stylesheet" href="/modernist.css">
  <link rel="stylesheet" href="/stijl.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23201e1d'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%23f3f2f2'/%3E%3C/svg%3E">
</head>
<body>
  <header class="kop" id="kop"></header>
  <main id="hoofd"></main>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="voorbeeld" class="voorbeeld">
    <div class="voorbeeld-binnen">
      <div class="voorbeeld-kop">
        <div class="naamcel"><strong>Voorbeeld van de mail</strong><small id="voorbeeld-onderwerp"></small></div>
        <select id="voorbeeld-dagen" class="keuzelijst klein" style="width:auto">
          <option value="0" selected>Wat de volgende mail bevat</option>
          <option value="7">Afgelopen week</option>
          <option value="14">Afgelopen twee weken</option>
        </select>
        <button id="voorbeeld-samenvatting" class="knop zacht klein" title="Vraagt per regio een samenvatting aan Claude of Ollama; dat kan even duren">Met samenvatting</button>
        <button id="voorbeeld-verstuur" class="knop zacht klein" hidden>Nu versturen</button>
        <button id="voorbeeld-sluit" class="knop inkt klein">Sluiten</button>
      </div>
      <iframe id="voorbeeld-frame" sandbox="allow-popups allow-popups-to-escape-sandbox" title="Voorbeeld van de mail"></iframe>
    </div>
  </dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
